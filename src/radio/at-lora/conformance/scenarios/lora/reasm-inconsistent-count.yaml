schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "reasm-inconsistent-count"
description: |
  A fragment disagreeing with its entry on count drops the entry as bad.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "reasm_trace"
    nack_gap_s: 20
    reassembly_s: 90
    events: [{"at": 0, "src": 1, "hex": "11000302aa"}, {"at": 1, "src": 1, "hex": "11000311bb"}, {"at": 2, "src": 1, "hex": "11000322cc"}]
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "reasm_trace"
    description: "trigger: reasm_trace"
expected_state:
  host:
    outputs: ["partial", "bad", "duplicate"]
    stats: {"bad": 1, "duplicate": 1}
