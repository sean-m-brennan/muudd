schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "frame-fragment-mtu-too-small"
description: |
  An MTU below 64 cannot carry the protocol; fragmenting is refused.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "fragment"
    type: "peer"
    msg_id: 1
    mtu: 63
    max_fragments: 8
    msg_len: 10
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "fragment"
    description: "trigger: fragment"
expected_state:
  host:
    error: true
