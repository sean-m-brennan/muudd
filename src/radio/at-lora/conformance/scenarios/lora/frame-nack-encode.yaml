schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "frame-nack-encode"
description: |
  A NACK for message 0xabcd missing fragments 0 and 15 encodes to five bytes.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "nack"
    msg_id: 43981
    missing: 32769
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "nack"
    description: "trigger: nack"
expected_state:
  host:
    hex: "14abcd8001"
