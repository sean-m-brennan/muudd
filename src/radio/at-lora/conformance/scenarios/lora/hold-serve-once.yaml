schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "hold-serve-once"
description: |
  The hold answers one NACK with the missing fragments, then nothing.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "hold_trace"
    hold_s: 120
    events: [{"at": 0, "put": {"dest": 9, "msg_id": 258, "frames_hex": ["11010202aa", "11010212bb", "11010222cc"]}}, {"at": 10, "serve": {"dest": 9, "msg_id": 258, "missing": 2}}, {"at": 11, "serve": {"dest": 9, "msg_id": 258, "missing": 2}}]
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "hold_trace"
    description: "trigger: hold_trace"
expected_state:
  host:
    outputs: ["held", "served 11010212bb", "served none"]
