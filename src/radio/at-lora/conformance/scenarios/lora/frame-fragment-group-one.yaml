schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "frame-fragment-group-one"
description: |
  A 225-byte group message at MTU 233 fits one DATA_GROUP frame, with the
  four-byte group tag in the header.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "fragment"
    type: "group"
    msg_id: 7
    tag_hex: "a1b2c3d4"
    mtu: 233
    max_fragments: 8
    msg_len: 225
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "fragment"
    description: "trigger: fragment"
expected_state:
  host:
    lengths: [233]
    headers_hex: ["12000700a1b2c3d4"]
