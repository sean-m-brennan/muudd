schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "frame-fragment-bcast-small-mtu"
description: |
  A one-byte broadcast at the smallest usable MTU (64) is one DATA_BCAST
  frame carrying the largest msg_id.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "fragment"
    type: "bcast"
    msg_id: 65535
    mtu: 64
    max_fragments: 8
    msg_len: 1
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "fragment"
    description: "trigger: fragment"
expected_state:
  host:
    lengths: [5]
    headers_hex: ["13ffff00"]
