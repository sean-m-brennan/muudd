schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "frame-nack-refuses-zero"
description: |
  A NACK naming no missing fragment is refused.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "nack"
    msg_id: 5
    missing: 0
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "nack"
    description: "trigger: nack"
expected_state:
  host:
    error: true
