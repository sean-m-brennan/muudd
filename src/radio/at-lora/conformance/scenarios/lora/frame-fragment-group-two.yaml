schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "frame-fragment-group-two"
description: |
  A 226-byte group message at MTU 233 needs a second DATA_GROUP frame, one
  payload byte past the first.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "fragment"
    type: "group"
    msg_id: 7
    tag_hex: "a1b2c3d4"
    mtu: 233
    max_fragments: 8
    msg_len: 226
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "fragment"
    description: "trigger: fragment"
expected_state:
  host:
    lengths: [233, 9]
    headers_hex: ["12000701a1b2c3d4", "12000711a1b2c3d4"]
