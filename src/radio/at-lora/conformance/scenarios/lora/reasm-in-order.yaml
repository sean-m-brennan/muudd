schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "reasm-in-order"
description: |
  Fragments in order complete the message; a repeat is a duplicate.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "reasm_trace"
    nack_gap_s: 20
    reassembly_s: 90
    events: [{"at": 0, "src": 1, "hex": "11010202aa"}, {"at": 1, "src": 1, "hex": "11010212bb"}, {"at": 2, "src": 1, "hex": "11010222cc"}, {"at": 3, "src": 1, "hex": "11010202aa"}]
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "reasm_trace"
    description: "trigger: reasm_trace"
expected_state:
  host:
    outputs: ["partial", "partial", "complete aabbcc", "duplicate"]
    stats: {"duplicate": 1}
