schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "frame-fragment-msg-id-negative"
description: |
  A negative message id is refused.
# C: refused by the adapter. lora_fragment takes a uint16_t msg_id, so the C
# API cannot express this id and the scenario tests only the Python library.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "fragment"
    type: "peer"
    msg_id: -1
    mtu: 233
    max_fragments: 8
    msg_len: 10
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "fragment"
    description: "trigger: fragment"
expected_state:
  host:
    error: true
