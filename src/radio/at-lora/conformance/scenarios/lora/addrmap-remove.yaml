schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "addrmap-remove"
description: |
  A removed entry is gone and may be announced afresh.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "addrmap_trace"
    events: [{"announce": ["aaaaaaaa-0000-4000-8000-000000000001", 4097, 5]}, {"remove": "aaaaaaaa-0000-4000-8000-000000000001"}, {"addr_of": "aaaaaaaa-0000-4000-8000-000000000001"}, {"remove": "aaaaaaaa-0000-4000-8000-000000000001"}, {"announce": ["aaaaaaaa-0000-4000-8000-000000000001", 4097, 1]}]
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "addrmap_trace"
    description: "trigger: addrmap_trace"
expected_state:
  host:
    outputs: ["accepted", "removed", "none", "absent", "accepted"]
