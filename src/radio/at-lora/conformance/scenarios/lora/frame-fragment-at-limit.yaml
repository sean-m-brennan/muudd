schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "frame-fragment-at-limit"
description: |
  A 1832-byte unicast at MTU 233 fills eight DATA_PEER fragments exactly.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "fragment"
    type: "peer"
    msg_id: 1
    mtu: 233
    max_fragments: 8
    msg_len: 1832
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "fragment"
    description: "trigger: fragment"
expected_state:
  host:
    lengths: [233, 233, 233, 233, 233, 233, 233, 233]
    headers_hex: ["11000107", "11000117", "11000127", "11000137", "11000147", "11000157", "11000167", "11000177"]
