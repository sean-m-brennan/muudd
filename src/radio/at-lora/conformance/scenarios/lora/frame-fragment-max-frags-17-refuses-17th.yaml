schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "frame-fragment-max-frags-17-refuses-17th"
description: |
  A limit of 17 counts as 16: 3665 bytes at MTU 233 need seventeen fragments and are refused.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "fragment"
    type: "peer"
    msg_id: 1
    mtu: 233
    max_fragments: 17
    msg_len: 3665
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "fragment"
    description: "trigger: fragment"
expected_state:
  host:
    error: true
