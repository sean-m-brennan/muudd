schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "frame-decode-peer"
description: |
  A DATA_PEER frame, fragment 1 of 3, decodes to its fields.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "decode"
    hex: "11010212aabb"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "decode"
    description: "trigger: decode"
expected_state:
  host:
    type: "peer"
    msg_id: 258
    idx: 1
    count: 3
    payload_hex: "aabb"
