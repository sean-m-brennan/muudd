schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "frame-fragment-max-frags-zero-is-one"
description: |
  Zero as the fragment limit counts as one: 229 bytes at MTU 233 still fill one DATA_PEER fragment.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "fragment"
    type: "peer"
    msg_id: 1
    mtu: 233
    max_fragments: 0
    msg_len: 229
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "fragment"
    description: "trigger: fragment"
expected_state:
  host:
    lengths: [233]
    headers_hex: ["11000100"]
