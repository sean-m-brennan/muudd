schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "frame-decode-bcast"
description: |
  A DATA_BCAST frame decodes with no group tag.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "decode"
    hex: "13000701ab"
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "decode"
    description: "trigger: decode"
expected_state:
  host:
    type: "bcast"
    msg_id: 7
    idx: 0
    count: 2
    payload_hex: "ab"
