schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "reasm-evict-tie-oldest-created"
description: |
  With equal first-seen times the earliest created message is the one evicted.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "reasm_trace"
    nack_gap_s: 20
    reassembly_s: 90
    events: [{"at": 0, "src": 1, "hex": "11000101aa"}, {"at": 0, "src": 1, "hex": "11000201aa"}, {"at": 0, "src": 1, "hex": "11000301aa"}, {"at": 0, "src": 1, "hex": "11000401aa"}, {"at": 0, "src": 1, "hex": "11000501aa"}, {"at": 1, "src": 1, "hex": "11000111bb"}, {"at": 1, "src": 1, "hex": "11000211bb"}]
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "reasm_trace"
    description: "trigger: reasm_trace"
expected_state:
  host:
    outputs: ["partial", "partial", "partial", "partial", "partial", "duplicate", "complete aabb"]
    stats: {"evicted": 1, "duplicate": 1}
