schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "reasm-timeout"
description: |
  A message not completed within the reassembly time is dropped and its key deduped.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "reasm_trace"
    nack_gap_s: 20
    reassembly_s: 90
    events: [{"at": 0, "src": 1, "hex": "11010202aa"}, {"at": 89, "tick": true}, {"at": 90, "tick": true}, {"at": 91, "src": 1, "hex": "11010212bb"}]
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "reasm_trace"
    description: "trigger: reasm_trace"
expected_state:
  host:
    outputs: ["partial", "tick nack:1:258:6", "tick", "duplicate"]
    stats: {"timeouts": 1, "duplicate": 1}
