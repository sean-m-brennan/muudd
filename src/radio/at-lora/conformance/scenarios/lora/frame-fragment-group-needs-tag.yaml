schema_version: "1"
kind: "scenario"
protocol: "lora"
name: "frame-fragment-group-needs-tag"
description: |
  A DATA_GROUP message without a group tag is refused.
byte_pinning: false
participants:
  - id: "host"
    role: "recipient"
fixtures:
  lora:
    op: "fragment"
    type: "group"
    msg_id: 1
    mtu: 233
    max_fragments: 8
    msg_len: 10
steps:
  - id: 1
    from: "host"
    to: "host"
    function: "fragment"
    description: "trigger: fragment"
expected_state:
  host:
    error: true
