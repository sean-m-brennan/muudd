[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newsbrief"
version = "0.1.0"
description = "A personal, local-first news briefing that ranks stories by consequence to you, not by clicks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13",
    "feedparser>=6.0",
    "numpy>=1.26",
    "openai>=1.50",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
newsbrief = "newsbrief.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/newsbrief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
