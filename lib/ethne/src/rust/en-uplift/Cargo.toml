[package]
name = "en-uplift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
en-core = { workspace = true }
en-charter = { workspace = true }
en-substrate = { workspace = true }
en-cohesion = { workspace = true }
# No §8 source-protection crypto here. The opt-out lives in the workspace entry, not
# on this line: a member's `default-features = false` is ignored for an inherited
# dependency, and cargo unifies features, so one default-on edge would re-enable it.
kc-core = { workspace = true }
# The ONE crate in the ethne workspace permitted a KC-record dependency. Confining
# it here keeps every other en-* crate kc-core-only (KC ⟂ ethne below this line).
kc-conduct = { workspace = true }
# Likewise for KC's envoy delegation (D14). Both KC-record deps stop here.
kc-identity = { workspace = true }
