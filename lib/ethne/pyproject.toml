[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ethne"
version = "0.1.0"
description = "Ethne polity tier: Python bindings over the Rust core"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sustainable Space" }]

[tool.maturin]
manifest-path = "src/rust/en-pyo3/Cargo.toml"
module-name = "ethne._core"
python-source = "src/python"
features = ["pyo3/extension-module"]
