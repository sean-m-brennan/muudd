[package]
name = "kc-conduct"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# No §8 source-protection crypto here. The opt-out lives in the workspace entry, not
# on this line: a member's `default-features = false` is ignored for an inherited
# dependency, and cargo unifies features, so one default-on edge would re-enable it.
kc-core = { workspace = true }
kc-ceremony = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
jiff = { workspace = true }
serde_json = { workspace = true }
