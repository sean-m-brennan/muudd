[package]
name = "kc-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The §8 whistleblower source-protection crypto: the linkable ring signature that
# proves insider standing without naming an insider, and the Feldman threshold custody
# that holds a source's identity. Default-on, so every kith-covenant consumer is
# unaffected. A tier that only needs identities, signatures and CIDs — the ethne polity
# tier is the case this exists for — switches it off with `default-features = false`
# and stops carrying `chacha20poly1305` for a feature it never calls.
default = ["source-protection"]
source-protection = ["dep:curve25519-dalek", "dep:chacha20poly1305"]

[dependencies]
ed25519-dalek = { workspace = true }
# §8 source protection only (ring signatures + threshold custody), behind the
# default-on `source-protection` feature. curve25519-dalek is ALSO reached through
# ed25519-dalek, so switching the feature off drops the edge but not the crate.
curve25519-dalek = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
rand = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
ciborium = { workspace = true }
jiff = { workspace = true }
bs58 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
