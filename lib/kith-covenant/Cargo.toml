[workspace]
resolver = "2"
members = [
    "crates/kc-core",
    "crates/kc-identity",
    "crates/kc-ceremony",
    "crates/kc-archive",
    "crates/kc-reputation",
    "crates/kc-pyo3",
    "examples/two_communities_demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.75"

[workspace.dependencies]
# Crypto. Ed25519-only for MVP per trustworthiness grounds (no known backdoors,
# battle-tested). Alg enum preserved as a one-variant structure to allow a future
# non-lattice PQC scheme (e.g. SLH-DSA/SPHINCS+) if/when one is accepted.
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8"

# Hashing / content-addressing
blake3 = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
ciborium = "0.2"

# Time
jiff = { version = "0.1", features = ["serde"] }

# Encoding helpers
bs58 = "0.5"
hex = "0.4"

# Errors / logging
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# PyO3
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }

# Testing
proptest = "1.5"

# Internal workspace crates
kc-core = { path = "crates/kc-core" }
kc-identity = { path = "crates/kc-identity" }
kc-ceremony = { path = "crates/kc-ceremony" }
kc-archive = { path = "crates/kc-archive" }
kc-reputation = { path = "crates/kc-reputation" }

[profile.release]
lto = "thin"
codegen-units = 1
